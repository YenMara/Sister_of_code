<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style.css">
    <title>Week3 Homework</title>
</head>
<body>
    <header>
        <div>
            <h2>Student Practice Webpage</h2>
            <h6>HTML + CSS Practice(Forms + Table Advanced)</h6>
        </div>
    </header>

    <main>
        <section>
            <div class="section1">
                <h3>Image Section</h4>
                <img src="image/img1.webp" alt="Image 1" class="img1">
            </div>
        </section>
        <section>
            <div class="section1 circle">
                <h3>Image Circle</h4>
                <img src="image/img1.webp" alt="Image 1" class="img1">
            </div>
        </section>
        <section>
            <div class="section1 oval">
                <h3>Image Oval</h4>
                <img src="image/img1.webp" alt="Image 1" class="img1">
            </div>
        </section>

        <section>
            <div>
                <h3 class="ad-table">Advanced Table</h3>
                <table border="1" cellpadding="10" cellspacing="0">
                    <thead>
                        <tr>
                            <th rowspan="2">Name</th>
                            <th colspan="2" class="score-span">Scores</th>
                            <th rowspan="2">Grade</th>
                        </tr>
                        <tr>
                            <td class="th2">Math</td>
                            <td class="th2">CSS</td>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Alice</td>
                            <td>90</td>
                            <td>95</td>
                            <td>A</td>
                        </tr>
                        <tr>
                            <td>Bob</td>
                            <td>80</td>
                            <td>85</td>
                            <td>B</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section>
            <div>
               
                <form action="">
                     <h2 style="margin-bottom: 15px;">Form 1: Basic Info</h2>
                    <label for="name" class="label-bold">Name <span style="color: red;">*</span></label><br>
                    <input type="text" id="name" name="name" class="custom-input"><br>
                    <label for="email" class="label-bold">Email <span style="color: red;">*</span></label><br>
                    <input type="email" id="email" name="email" class="custom-input"><br>
                    <label for="password" class="label-bold">Password <span style="color: red;">*</span></label><br>
                    <input type="password" id="password" name="password" class="custom-input"><br>
                     <label for="file" class="label-bold">Upload File</label><br>
                   <div class="upload-file">
                    <input type="file" id="file" name="file"><br> 
                   </div>
                    <input type="submit" value="Submit" class="btn">
                    <input type="reset" value="Reset" class="btn">

                </form>
            </div>
        </section>
        <section>
            <div>
               
                <form action="">
                     <h2 style="margin-bottom: 15px;">Form 2: Survey Form</h2>
                    <label for="course" class="label-bold">Choose Course <span style="color: red;">*</span></label><br>
                   <select id="course" name="course">
                    <option value="select">Select</option>
                    <option value="select">HTML</option>
                    <option value="select">CSS</option>
                    <option value="select">JavaScript</option>
                   </select><br>
                    <label class="gender label-bold">Gender</label>
                    <div class="g-redio">
                        <input type="radio" id="male" name="gender" value="male">
                        <label for="male" class="male">Male</label>
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female">Female</label><br>
                    </div>
                     <label class="gender label-bold">Skills</label>
                     <div class="g-redio">
                        <input type="checkbox" id="hobby1" name="hobby" value="reading" class="checkbox1">
                        <label for="hobby1">Reading</label>
                        <input type="checkbox" id="hobby2" name="hobby" value="traveling" class="checkbox">
                        <label for="hobby2">Traveling</label>
                        <input type="checkbox" id="hobby3" name="hobby" value="coding" class="checkbox">
                        <label for="hobby3">Coding</label><br>
                     </div>
                     <label for="phone" class="label-bold">Phone <span style="color: red;">*</span></label><br>
                    <input type="tel" id="phone" name="phone" class="custom-input"><br>
                     <label for="message" class="label-bold">Message</label><br>
                    <textarea id="message" name="message" class="custom-input"></textarea><br>

                    <input type="submit" value="Send" class="btn">
                    

                </form>
            </div>
        </section>

        

    </main>
</body>
</html>
